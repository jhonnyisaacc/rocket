# Capability → provider. Workflows depend on capabilities, not vendor modules.
# Add a provider by implementing the protocol and adding a row here.

[macro]
primary = "openbb_fred"
fallbacks = ["fred_csv"]
env = ["FRED_API_KEY"]

[quotes]
primary = "yahoo"
fallbacks = []
env = []

[fundamentals]
primary = "fmp"
fallbacks = ["massive"]
env = ["FMP_API_KEY", "MASSIVE_API_KEY"]

[universe]
primary = "coingecko"
fallbacks = []
size = 100

[perps]
primary = "hyperliquid"
fallbacks = []
# HL_WALLET exists in this environment and is listed so Rocket never drops it.
# Live research uses public POST /info only and does not read the wallet.
env = ["HL_WALLET"]

[cot]
# OpenBB is optional. The durable source is the official CFTC futures report.
primary = "cftc"
fallbacks = ["openbb_cftc"]
env = ["OPENBB_PYTHON"]

[ism]
primary = "ism_official_roundup"
fallbacks = ["ism_prnewswire_archive"]

[disclosures_official]
primary = "house_oge"
fallbacks = []

[disclosures_secondary]
primary = "fmp"
env = ["FMP_API_KEY"]

[transcript]
primary = "supadata"
fallbacks = []
env = ["SUPADATA_API_KEY", "SUPADATA_API_TOKEN"]

[inventory]
primary = "solana_ondo"
fallbacks = []
env = ["SOLANA_RPC_URL", "HELIUS_API_KEY", "ROCKET_INVENTORY_ADDRESS", "ROCKET_ASSET_REGISTRY"]

[cava_discovery]
primary = "youtube_rss"
fallbacks = ["supadata_metadata"]
env = ["SUPADATA_API_KEY"]

[news]
primary = "fmp_news"
fallbacks = ["openbb_news"]
env = ["FMP_API_KEY", "OPENBB_PYTHON"]

[memecoin_capture]
primary = "pumpapi"
fallbacks = []
