# Capability → environment variable names already used in this environment.
# Rocket reads these. It never deletes, unsets, or rewrites them.

[rocket]
ROCKET_HOME = ["ROCKET_HOME", "NAVE_RESEARCH_STATE_DIR"]
ROCKET_PORTFOLIO_STATE = ["ROCKET_PORTFOLIO_STATE", "NAVE_PORTFOLIO_STATE_FILE"]
ROCKET_WATCH_STATE = ["ROCKET_WATCH_STATE", "NAVE_QUANT_WATCH_STATE_FILE"]
ROCKET_INVENTORY_ADDRESS = ["ROCKET_INVENTORY_ADDRESS"]

[secrets]
FRED_API_KEY = ["FRED_API_KEY"]
FMP_API_KEY = ["FMP_API_KEY"]
SUPADATA_API_KEY = ["SUPADATA_API_KEY", "SUPADATA_API_TOKEN"]
HELIUS_API_KEY = ["HELIUS_API_KEY"]
MASSIVE_API_KEY = ["MASSIVE_API_KEY"]
HL_WALLET = ["HL_WALLET"]
