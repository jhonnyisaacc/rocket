name: Wallet
on:
  pull_request:
    paths:
      - "wallet/**"
      - ".github/workflows/wallet.yml"
  push:
    branches: [main]
    paths:
      - "wallet/**"
      - ".github/workflows/wallet.yml"
permissions:
  contents: read
jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node scripts/check-file-size.mjs
      - run: node scripts/check-boundaries.mjs
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
