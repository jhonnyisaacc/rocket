name: Listing trader
on:
  pull_request:
    paths:
      - "listing-trader/**"
      - ".github/workflows/listing-trader.yml"
  push:
    branches: [main]
    paths:
      - "listing-trader/**"
      - ".github/workflows/listing-trader.yml"
permissions:
  contents: read
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listing-trader
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: listing-trader/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
