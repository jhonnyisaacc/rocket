name: Listing trader
on:
  pull_request:
    paths:
      - "listing-trader/**"
      - ".github/workflows/listing-trader.yml"
  push:
    branches: [main]
    paths:
      - "listing-trader/**"
      - ".github/workflows/listing-trader.yml"
permissions:
  contents: read
jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listing-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: listing-trader/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
